<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Restaurant Tip &amp; Bill Splitter</title>
  <style>
    :root {
      font-family: Arial, sans-serif;
      color: #172033;
      background: #eef3fa;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
    }

    main {
      width: min(430px, calc(100% - 32px));
      margin: 24px auto;
      padding: 24px;
      border-radius: 14px;
      background: white;
      box-shadow: 0 10px 30px rgba(30, 50, 90, 0.12);
    }

    h1 {
      margin: 0 0 20px;
      font-size: 1.55rem;
      text-align: center;
    }

    label {
      display: block;
      margin-top: 14px;
      font-weight: 700;
    }

    input {
      box-sizing: border-box;
      width: 100%;
      margin-top: 6px;
      padding: 10px;
      border: 1px solid #bbc4d1;
      border-radius: 7px;
      font-size: 1rem;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    button {
      flex: 1;
      border: 0;
      border-radius: 7px;
      padding: 11px;
      font-size: 1rem;
      cursor: pointer;
    }

    .calculate {
      color: white;
      background: #285cc4;
    }

    .reset {
      color: #273349;
      background: #e7ebf2;
    }

    #error {
      min-height: 20px;
      margin: 12px 0 0;
      color: #b42318;
      font-weight: 700;
    }

    #receipt {
      display: none;
      margin-top: 16px;
      padding: 16px;
      border: 1px solid #d8deea;
      border-radius: 8px;
      background: #f8faff;
    }

    #receipt p {
      display: flex;
      justify-content: space-between;
      margin: 8px 0;
    }
  </style>
</head>
<body>
  <main>
    <h1>Restaurant Tip &amp; Bill Splitter</h1>

    <form id="billForm" novalidate>
      <label for="subtotal">Meal subtotal ($)</label>
      <input id="subtotal" name="subtotal" type="number" min="0.01" step="0.01" required>

      <label for="tip">Tip percentage</label>
      <input id="tip" name="tip" type="number" min="0" step="1" required>

      <label for="people">Number of people</label>
      <input id="people" name="people" type="number" min="1" step="1" required>

      <div class="buttons">
        <button class="calculate" type="submit">Calculate</button>
        <button class="reset" type="reset">Reset</button>
      </div>
    </form>

    <p id="error" role="alert"></p>

    <section id="receipt" aria-live="polite">
      <h2>Bill &amp; Tip Breakdown</h2>
      <p><span>Meal Subtotal:</span><strong id="subtotalOutput"></strong></p>
      <p><span id="tipLabel"></span><strong id="tipOutput"></strong></p>
      <p><span>Total Bill:</span><strong id="totalOutput"></strong></p>
      <p><span id="splitLabel"></span><strong id="perPersonOutput"></strong></p>
    </section>
  </main>

  <script>
    const form = document.getElementById("billForm");
    const error = document.getElementById("error");
    const receipt = document.getElementById("receipt");

    function formatMoney(amount) {
      return "$" + amount.toFixed(2);
    }

    form.addEventListener("submit", function (event) {
      event.preventDefault();
      error.textContent = "";
      receipt.style.display = "none";

      const subtotal = Number(document.getElementById("subtotal").value);
      const tipPercent = Number(document.getElementById("tip").value);
      const numPeople = Number(document.getElementById("people").value);

      if (!Number.isFinite(subtotal) || subtotal <= 0) {
        error.textContent = "Invalid input. Please enter a subtotal greater than $0.00.";
        return;
      }

      if (!Number.isInteger(tipPercent) || tipPercent < 0) {
        error.textContent = "Invalid input. Please enter a whole-number tip percentage of 0 or more.";
        return;
      }

      if (!Number.isInteger(numPeople) || numPeople < 1) {
        error.textContent = "Invalid input. Please enter a whole number of at least 1.";
        return;
      }

      const tipAmount = subtotal * (tipPercent / 100);
      const totalBill = subtotal + tipAmount;
      const perPersonCost = totalBill / numPeople;

      document.getElementById("subtotalOutput").textContent = formatMoney(subtotal);
      document.getElementById("tipLabel").textContent = "Tip (" + tipPercent + "%):";
      document.getElementById("tipOutput").textContent = formatMoney(tipAmount);
      document.getElementById("totalOutput").textContent = formatMoney(totalBill);
      document.getElementById("splitLabel").textContent =
        "Split (" + numPeople + (numPeople === 1 ? " person):" : " people):");
      document.getElementById("perPersonOutput").textContent =
        formatMoney(perPersonCost) + " per person";

      receipt.style.display = "block";
    });

    form.addEventListener("reset", function () {
      error.textContent = "";
      receipt.style.display = "none";
    });
  </script>
</body>
</html>
